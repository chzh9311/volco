defaults:
  # - msdf: sparse
  - msdf: "dense"
  # - msdf: "64_4"
  - data: grab_multi_contact
  # - ae: gridae_128latent_v2
  # - ae: gridae_64latent_v2
  - ae: gridae_256latent_v2
  - hand_ae: handvae_16latent
  - generator: dual_ldm
  - pose_optimizer: hybrid
  - _self_

training_stage: "generator"
contact_unit: "grid"

train:
  optimizer: "adamw"
  lr: 1e-4
  batch_size: 64
  vis_every_n_batches: 5000
  log_every_n_batches: 100
  augment: false
  loss_weights:
    latent_mse: 1.0
    difference_loss: 0.1
    hand_recon_loss: 0.1
    stable_loss: 0.1
    # contact_loss: 1.0
    # cse_value_loss: 1.0
    # consistency_contact_loss: 5.0
    # consistency_cse_loss: 1.0
  
  resume_ckpt: # logs/checkpoints/mlcdiff/with_hand_guide/newae_v2/last.ckpt

seed: 1987

val:
  batch_size: 48
  vis_every_n_batches: 50

checkpoint:
  filename: best
  save_top_k: 3

test:
  n_processes: 20
  n_samples: 20
  batch_size: ${test.n_samples}
  vis_result: true  # set to false to skip rendering and remove image columns from wandb table
  use_cache: false  # if true, reuse cached hand results (tmp/grab/result_{obj}.pkl) instead of rerunning diffusion + pose optimization
  base_criteria:
    - "Simulation Displacement"
    - "Penetration Depth"
    - "Intersection Volume"
    # - "Boolean Intersection Volume"
    - "Contact Area"
    - "Contact Ratio"
    - "Cluster Size"
    - "Entropy"
    - "IV/CA"  # per-sample Intersection Volume / Contact Area, then averaged (needs both above active)
  criteria: ${test.base_criteria}

trainer: ## For instantiating pytorch-lightning Trainer
  max_epochs: 100
  check_val_every_n_epoch: 1
  log_every_n_steps: 50
  accelerator: gpu
  devices: 2
  precision: 32
  enable_progress_bar: false
  enable_model_summary: true
  # gradient_clip_val: 1.0
  # profiler: simple
  # limit_train_batches: 10
  # limit_val_batches: 10

physics:
  k: 0.2
  mu: 0.8
  pene_th: 1e-3 # 1mm
  eps: 1e-3 

run_phase: train
test_gt: false
ckpt_path: "Random"
optimizer: adamw

debug: true
vis_backend: open3d  # open3d (hardware) or matplotlib (software)
pose_optimizer:
  w_repulsive: 0.4
  contact_th: 0.05

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
  job_logging:
    disable_existing_loggers: false
  hydra_logging:
    disable_existing_loggers: false